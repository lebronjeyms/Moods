name: Sniper Auto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install jq -y

      - name: Run Sniper Update
        run: |
          echo "Starting updating the file..."
          node main.js

      - name: Check for Changes
        id: git-check
        run: |
          if ! git diff --exit-code mooddata.json; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push Changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mooddata.json
          git commit -m "🤖 Auto update moods - $(date '+%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Log Update Results
        run: |
          echo "--- mooddata.json ---"
          if [ -f "mooddata.json" ]; then
            TOTAL_ITEMS=$(jq '.totalItems' mooddata.json)
            LAST_UPDATE=$(jq -r '.lastUpdate' mooddata.json)
            echo "Update completed"
            echo "Total items: $TOTAL_ITEMS"
            echo "Last update: $LAST_UPDATE"
          else
            echo "⚠️ mooddata.json not found"
          fi
